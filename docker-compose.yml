services:
  db:
    image: postgres:18-alpine
    container_name: mi_app_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-IMETESH}

    volumes:
      # Ruta corregida para PostgreSQL 18+
      - postgres_data:/var/lib/postgresql

      # Script de inicialización
      - ./BD_WEB_PAGE/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-IMETESH}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: ./WEB_PAGE
    container_name: mi_app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-IMETESH}
      SECRET_KEY: una-clave-secreta-temporal

    ports:
      - "5000:5000"

    volumes:
      - ./WEB_PAGE:/app

volumes:
  postgres_data: